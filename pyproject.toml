[project]
name = "kcwm"
version = "0.1.0"
description = "NetForecast v2: Kill-Chain World Model for network attack forecasting (SIH PS 26153, NTRO)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Packet capture parsing. Split out because nfstream pulls native deps (libpcap).
pcap = ["nfstream>=6.5", "scapy>=2.5"]
ui = ["streamlit>=1.38", "plotly>=5.24", "networkx>=3.3"]
explain = ["shap>=0.46", "matplotlib>=3.9"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
kcwm = "kcwm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kcwm"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "B023", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the real datasets under paths.data_root (skipped when absent)"]
