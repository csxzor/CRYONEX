name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check kcwm tests scripts
      - run: uv run pytest -q
  docker-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kcwm .
      # the console and CLI must work with no network at all
      - run: docker run --rm --network none kcwm kcwm --help
